<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Погода</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #0d1117; --card: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
      --warm: #f78166; --cold: #79c0ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 24px 16px;
    }
    .container { max-width: 1100px; margin: 0 auto; }

    /* ── Header ── */
    header { margin-bottom: 28px; display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .header-left h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; }
    .header-left h1 span { font-size: 1.1rem; color: var(--muted); font-weight: 400; }
    #updated-at { color: var(--muted); font-size: 0.8rem; margin-top: 6px; }

    /* Station button */
    #btn-station {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 8px 16px; border-radius: 8px;
      cursor: pointer; font-size: 0.9rem; transition: border-color 0.15s;
      white-space: nowrap;
    }
    #btn-station:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Cards ── */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; margin-bottom: 20px; }
    .section-title { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 18px; }

    /* ── Month nav ── */
    .month-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .month-nav button {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: border-color 0.15s;
    }
    .month-nav button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .month-nav button:disabled { opacity: 0.3; cursor: default; }
    .month-nav .month-label { font-size: 1rem; font-weight: 600; min-width: 140px; text-align: center; }

    /* ── Chart ── */
    .chart-legend { display: flex; gap: 20px; margin-bottom: 14px; font-size: 0.8rem; }
    .legend-item { display: flex; align-items: center; gap: 7px; color: var(--muted); }
    .legend-line { width: 28px; height: 2px; border-radius: 2px; }
    .legend-line.current { background: #f78166; }
    .legend-line.avg { height: 0; border-top: 2px dashed #6e7681; }
    .chart-wrap { position: relative; height: 430px; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    thead th { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    tbody td { padding: 7px 12px; border-bottom: 1px solid #21262d; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #1c2128; }
    .t-max { color: var(--warm); font-weight: 600; }
    .t-min { color: var(--cold); }
    .t-norm { color: #8b949e; font-size: 0.85rem; }
    .t-today td { background: #1a2332; }
    .badge-today { display: inline-block; background: #1a3a5c; color: var(--accent); font-size: 0.65rem; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }

    /* ── Forecast ── */
    .forecast-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .forecast-day { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 10px; text-align: center; }
    .forecast-day.today { border-color: var(--accent); }
    .fday-date { font-size: 0.7rem; color: var(--muted); margin-bottom: 2px; }
    .fday-weekday { font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; }
    .forecast-day.today .fday-weekday { color: var(--accent); }
    .fday-icon { font-size: 1.6rem; margin-bottom: 8px; display: block; }
    .fday-max { font-size: 1.3rem; font-weight: 700; color: var(--warm); display: block; }
    .fday-min { font-size: 0.8rem; color: var(--cold); margin-top: 2px; display: block; }
    .fday-precip { font-size: 0.7rem; color: var(--muted); margin-top: 5px; display: block; }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 1000;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; width: 100%; max-width: 680px;
      max-height: 90vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px 14px; border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { font-size: 1rem; font-weight: 600; }
    .modal-close { background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; line-height: 1; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 18px 22px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }

    /* Search */
    .search-row { display: flex; gap: 8px; }
    .search-row input {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 0.9rem;
    }
    .search-row input:focus { outline: none; border-color: var(--accent); }
    .search-row input::placeholder { color: var(--muted); }
    .search-row button {
      background: var(--accent); border: none; color: #fff;
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
    }
    .search-results { display: flex; flex-direction: column; gap: 4px; }
    .search-result-item {
      padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer; font-size: 0.88rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .search-result-item:hover { border-color: var(--accent); color: var(--accent); }
    .search-result-item .coords { color: var(--muted); font-size: 0.75rem; }

    /* Map */
    #leaflet-map { height: 320px; border-radius: 8px; border: 1px solid var(--border); }
    .map-hint { font-size: 0.78rem; color: var(--muted); }
    .selected-location {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; font-size: 0.88rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .selected-location strong { color: var(--accent); }
    .selected-location .coords-text { color: var(--muted); font-size: 0.78rem; }

    .modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
    .btn-primary { background: var(--accent); border: none; color: #fff; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
    .btn-secondary { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }

    .spinner { color: var(--muted); text-align: center; padding: 40px 20px; font-size: 0.9rem; }
    .error-msg { color: #f85149; background: #1a1f2e; border: 1px solid #3d1c1c; border-radius: 8px; padding: 16px; font-size: 0.88rem; }
    .attribution { text-align: center; color: var(--muted); font-size: 0.72rem; padding: 12px 0 4px; }
    .attribution a { color: var(--accent); text-decoration: none; }

    @media (max-width: 600px) {
      .forecast-grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }
      .card { padding: 16px; }
      #leaflet-map { height: 240px; }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="header-left">
      <h1 id="page-title">🏔 Краков <span>/ Kraków, Польша</span></h1>
      <div id="updated-at">Загрузка данных…</div>
    </div>
    <button id="btn-station">📍 Сменить город</button>
  </header>

  <!-- Chart -->
  <div class="card">
    <div class="section-title">Максимальные температуры за месяц</div>
    <div class="month-nav">
      <button id="btn-prev">← Назад</button>
      <span class="month-label" id="chart-month-label">…</span>
      <button id="btn-next">Вперёд →</button>
    </div>
    <div class="chart-legend">
      <div class="legend-item"><div class="legend-line current"></div><span>Макс. т-ра</span></div>
      <div class="legend-item"><div class="legend-line" style="border-top:2px dashed #79c0ff;height:0;background:none"></div><span>Мин. т-ра</span></div>
      <div class="legend-item"><div class="legend-line avg"></div><span>Среднее 2021–2025</span></div>
      <div class="legend-item"><div style="width:2px;height:14px;background:rgba(100,116,139,0.4);border-radius:1px"></div><span>Пн</span></div>
    </div>
    <div class="chart-wrap">
      <div class="spinner" id="chart-spinner">Загрузка данных…</div>
      <canvas id="tempChart" style="display:none"></canvas>
    </div>
  </div>

  <div class="attribution">
    Данные: <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a> — CC BY 4.0 •
    Карта: <a href="https://www.openstreetmap.org/" target="_blank">OpenStreetMap</a>
  </div>
</div>

<!-- Station modal -->
<div class="modal-overlay" id="station-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Выбрать город / станцию</h3>
      <button class="modal-close" id="btn-modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="search-row">
        <input type="text" id="city-search" placeholder="Введите название города…" />
        <button id="btn-search">Найти</button>
      </div>
      <div class="search-results" id="search-results"></div>
      <p class="map-hint">Или кликните на карте чтобы выбрать точку</p>
      <div id="leaflet-map"></div>
      <div class="selected-location" id="selected-location" style="display:none">
        <span id="selected-name">—</span>
        <span class="coords-text" id="selected-coords-text">—</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="btn-modal-cancel">Отмена</button>
      <button class="btn-primary" id="btn-modal-confirm">Применить</button>
    </div>
  </div>
</div>

<script>
const RU_WEEKDAYS   = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const RU_MONTHS     = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const RU_MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const RU_MONTHS_SHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

/* ── Moon phase ── */
function getMoonPhaseDays(dateStr) {
  const refNewMoon = new Date('2000-01-06T18:14:00Z');
  const cycleMs = 29.53058867 * 864e5;
  const elapsed = ((new Date(dateStr+'T12:00:00') - refNewMoon) % cycleMs + cycleMs) % cycleMs;
  return elapsed / 864e5; // 0–29.53 days through cycle
}
function moonEmoji(p) {
  const f = p / 29.53058867;
  if (f<0.0625||f>=0.9375) return '🌑';
  if (f<0.1875) return '🌒';
  if (f<0.3125) return '🌓';
  if (f<0.4375) return '🌔';
  if (f<0.5625) return '🌕';
  if (f<0.6875) return '🌖';
  if (f<0.8125) return '🌗';
  return '🌘';
}
const isWaxing = p => p < 14.765; // first half of cycle

/* ── Moon plugin ── */
const moonPlugin = {
  id: 'moonPlugin',
  afterDraw(chart) {
    const data = chart._moonData;
    if (!data) return;
    const {ctx, scales:{x:xs}, height} = chart;
    ctx.save();
    ctx.font = '11px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    data.forEach((d,i) => {
      const x = xs.getPixelForValue(i);
      ctx.fillText(d.moon, x, height - 10);
      if (d.plant) ctx.fillText('🌱', x, height - 24);
      if (d.rain)  ctx.fillText('💧', x, height - 38);
    });
    ctx.restore();
  }
};
Chart.register(moonPlugin);

/* ── Global state ── */
const G = {
  lat: 50.0647, lon: 19.9450, cityName: 'Краков',
  allActual: new Map(),
  allMin: new Map(),      // date → temperature_2m_min (2026 + forecast)
  allPrecip: new Map(),   // date → precipitation_sum (2026)
  precipCache: new Map(), // "YYYY-MM" → Map(date → precip)  for historical months
  avgByDay: {},
  chartInst: null,
  viewYear: new Date().getFullYear(),
  viewMonth: new Date().getMonth(),
};

/* ── Helpers ── */
const todayStr     = () => new Date().toISOString().slice(0,10);
const dateOffset   = n => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const monthStart   = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; };

function fmtTemp(v) {
  if (v===null||v===undefined||isNaN(v)) return '—';
  const r = Math.round(v);
  return (r>=0?'+':'')+r+'°';
}

function wmoIcon(c) {
  if (c===0) return '☀️'; if (c<=2) return '🌤️'; if (c===3) return '☁️';
  if (c<=48) return '🌫️'; if (c<=55) return '🌦️'; if (c<=65) return '🌧️';
  if (c<=77) return '🌨️'; if (c<=82) return '🌦️'; if (c<=86) return '🌨️';
  return '⛈️';
}

/* ── API ── */
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

const TZ = () => 'Europe%2FWarsaw';

const urlForecast = () =>
  `https://api.open-meteo.com/v1/forecast?latitude=${G.lat}&longitude=${G.lon}` +
  `&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode&timezone=${TZ()}&forecast_days=14`;

const urlArchive = (s,e,vars) =>
  `https://archive-api.open-meteo.com/v1/archive?latitude=${G.lat}&longitude=${G.lon}` +
  `&start_date=${s}&end_date=${e}&daily=${vars}&timezone=${TZ()}`;

/* ── Build global stores ── */
function buildGlobalData(archiveYear, forecastData, hist5yr) {
  G.allActual.clear(); G.allMin.clear(); G.allPrecip.clear(); G.precipCache.clear();
  Object.keys(G.avgByDay).forEach(k => delete G.avgByDay[k]);

  if (hist5yr?.daily) {
    const {time, temperature_2m_max} = hist5yr.daily;
    const sum={}, cnt={};
    time.forEach((dt,i) => {
      const v = temperature_2m_max[i];
      if (v!==null && !isNaN(v)) {
        G.allActual.set(dt, v);
        const k = dt.slice(5);
        sum[k] = (sum[k]||0)+v; cnt[k] = (cnt[k]||0)+1;
      }
    });
    Object.keys(sum).forEach(k => { G.avgByDay[k] = +(sum[k]/cnt[k]).toFixed(1); });
  }

  if (archiveYear?.daily) {
    const {time, temperature_2m_max, temperature_2m_min, precipitation_sum} = archiveYear.daily;
    time.forEach((dt,i) => {
      const v=temperature_2m_max[i]; if(v!==null&&!isNaN(v)) G.allActual.set(dt,v);
      const mn=temperature_2m_min?.[i]; if(mn!==null&&mn!==undefined) G.allMin.set(dt,mn);
      const p=precipitation_sum?.[i]; if(p!==null&&p!==undefined) G.allPrecip.set(dt,p);
    });
  }

  if (forecastData?.daily) {
    const {time, temperature_2m_max, temperature_2m_min, precipitation_sum} = forecastData.daily;
    time.forEach((dt,i) => {
      const v=temperature_2m_max[i]; if(!G.allActual.has(dt)&&v!==null&&!isNaN(v)) G.allActual.set(dt,v);
      const mn=temperature_2m_min?.[i]; if(!G.allMin.has(dt)&&mn!==null&&mn!==undefined) G.allMin.set(dt,mn);
      const p=precipitation_sum?.[i]; if(!G.allPrecip.has(dt)&&p!==null&&p!==undefined) G.allPrecip.set(dt,p);
    });
  }
}

/* ── Chart ── */
function renderChart() {
  const {viewYear, viewMonth} = G;
  const days = new Date(viewYear, viewMonth+1, 0).getDate();
  const labels=[], dsActual=[], dsMin=[], dsAvg=[];
  const monthKey = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}`;
  const precipMonth = G.precipCache.get(monthKey) || G.allPrecip;
  const mondayIndices = []; // indices of Mondays for vertical lines
  const moonData = [];

  for (let d=1; d<=days; d++) {
    const dt = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const mmdd = dt.slice(5);
    const dow = new Date(dt+'T12:00:00').getDay(); // 0=Sun,1=Mon
    labels.push(d);
    dsActual.push(G.allActual.has(dt) ? +G.allActual.get(dt).toFixed(1) : null);
    dsMin.push(G.allMin.has(dt) ? +G.allMin.get(dt).toFixed(1) : null);
    dsAvg.push(G.avgByDay[mmdd]!==undefined ? G.avgByDay[mmdd] : null);
    if (dow===1) mondayIndices.push(d-1); // 0-based index

    const phase = getMoonPhaseDays(dt);
    const precip = precipMonth.get(dt) ?? 0;
    moonData.push({ moon: moonEmoji(phase), rain: precip > 1, plant: isWaxing(phase) && precip > 1 });
  }

  document.getElementById('chart-month-label').textContent = `${RU_MONTHS[viewMonth]} ${viewYear}`;

  const now = new Date();
  document.getElementById('btn-prev').disabled = (viewYear===2021 && viewMonth===0);
  document.getElementById('btn-next').disabled = (viewYear===now.getFullYear() && viewMonth===now.getMonth());

  document.getElementById('chart-spinner').style.display = 'none';
  document.getElementById('tempChart').style.display = 'block';

  // Monday lines plugin (inline, uses closure over mondayIndices)
  const mondayPlugin = {
    id: 'mondayLines',
    beforeDatasetsDraw(chart) {
      const {ctx, chartArea:{top,bottom}, scales:{x:xs}} = chart;
      ctx.save();
      ctx.strokeStyle = 'rgba(100,116,139,0.35)';
      ctx.lineWidth = 1;
      ctx.setLineDash([]);
      mondayIndices.forEach(i => {
        const x = xs.getPixelForValue(i);
        ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
      });
      ctx.restore();
    }
  };

  if (G.chartInst) G.chartInst.destroy();
  const ctx = document.getElementById('tempChart').getContext('2d');
  G.chartInst = new Chart(ctx, {
    type: 'line',
    plugins: [mondayPlugin],
    data: { labels, datasets: [
      { label: 'Макс. т-ра', data: dsActual, borderColor: '#f78166', backgroundColor: 'rgba(247,129,102,0.08)',
        borderWidth: 2, pointRadius: 2, pointHoverRadius: 5, tension: 0.25, fill: true, spanGaps: false, order: 1 },
      { label: 'Мин. т-ра', data: dsMin, borderColor: '#79c0ff', backgroundColor: 'transparent',
        borderWidth: 1.5, borderDash: [3,3], pointRadius: 0, pointHoverRadius: 4, tension: 0.25, spanGaps: false, order: 2 },
      { label: 'Среднее 2021–2025', data: dsAvg, borderColor: '#484f58', borderWidth: 1.5,
        borderDash: [5,4], backgroundColor: 'transparent', pointRadius: 0, pointHoverRadius: 3, tension: 0.3, order: 3 }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { bottom: 52 } },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1c2128', borderColor: '#30363d', borderWidth: 1,
          titleColor: '#e6edf3', bodyColor: '#8b949e', padding: 10,
          callbacks: {
            title: ([item]) => `${item.label} ${RU_MONTHS_GEN[viewMonth]} ${viewYear}`,
            label: item => {
              if (item.raw===null) return null;
              const dt = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(item.label).padStart(2,'0')}`;
              const p = (G.precipCache.get(monthKey)||G.allPrecip).get(dt);
              const moon = moonEmoji(getMoonPhaseDays(dt));
              const precip = p>0.1 ? `  💧 ${p.toFixed(1)} мм` : '';
              const base = `${item.dataset.label}: ${item.raw>=0?'+':''}${item.raw}°C`;
              return item.datasetIndex===0 ? base + precip + `  ${moon}` : base;
            }
          }
        }
      },
      scales: {
        x: { ticks: { color: '#484f58' }, grid: { color: '#1c2128' } },
        y: { ticks: { color: '#484f58', callback: v => (v>=0?'+':'')+v+'°' }, grid: { color: '#21262d' } }
      }
    }
  });
  G.chartInst._moonData = moonData;
}


/* ── Main load ── */
async function loadData() {
  document.getElementById('chart-spinner').style.display='block';
  document.getElementById('tempChart').style.display='none';

  const year = new Date().getFullYear();
  const [forecastData, archiveYearData, hist5yr] = await Promise.all([
    fetchJSON(urlForecast()),
    fetchJSON(urlArchive(`${year}-01-01`, dateOffset(-2), 'temperature_2m_max,temperature_2m_min,precipitation_sum')),
    fetchJSON(urlArchive('2021-01-01','2025-12-31','temperature_2m_max')),
  ]);

  document.getElementById('updated-at').textContent =
    `Обновлено: ${new Date().toLocaleString('ru-RU',{timeZone:'Europe/Warsaw'})} • Open-Meteo`;

  buildGlobalData(archiveYearData, forecastData, hist5yr);

  G.viewYear  = new Date().getFullYear();
  G.viewMonth = new Date().getMonth();

  renderChart();
}

async function main() {
  try { await loadData(); }
  catch(err) {
    console.error(err);
    document.getElementById('updated-at').textContent = 'Ошибка загрузки данных';
    const msg = `<div class="error-msg">Не удалось загрузить данные.<br><small>${err.message}</small></div>`;
    document.getElementById('chart-spinner').textContent = 'Ошибка: ' + err.message;
  }
}

/* ── Chart navigation ── */
async function navigateToMonth(year, month) {
  G.viewYear = year; G.viewMonth = month;
  const key = `${year}-${String(month+1).padStart(2,'0')}`;
  // Fetch precipitation for this month if not cached (historical months)
  if (!G.precipCache.has(key) && !key.startsWith(`${new Date().getFullYear()}`)) {
    try {
      const start = `${key}-01`;
      const end = new Date(year, month+1, 0).toISOString().slice(0,10);
      const data = await fetchJSON(urlArchive(start, end, 'precipitation_sum'));
      const map = new Map();
      data.daily?.time.forEach((dt,i) => {
        const p = data.daily.precipitation_sum[i];
        if (p!==null) map.set(dt, p);
      });
      G.precipCache.set(key, map);
    } catch(e) { G.precipCache.set(key, new Map()); }
  }
  renderChart();
}

document.getElementById('btn-prev').addEventListener('click', () => {
  const y = G.viewMonth===0 ? G.viewYear-1 : G.viewYear;
  const m = G.viewMonth===0 ? 11 : G.viewMonth-1;
  navigateToMonth(y, m);
});
document.getElementById('btn-next').addEventListener('click', () => {
  const n=new Date();
  if (G.viewYear===n.getFullYear()&&G.viewMonth===n.getMonth()) return;
  const y = G.viewMonth===11 ? G.viewYear+1 : G.viewYear;
  const m = G.viewMonth===11 ? 0 : G.viewMonth+1;
  navigateToMonth(y, m);
});

/* ── Station modal ── */
let leafletMap=null, leafletMarker=null;
let pendingLat=G.lat, pendingLon=G.lon, pendingName=G.cityName;

function openModal() {
  pendingLat=G.lat; pendingLon=G.lon; pendingName=G.cityName;
  document.getElementById('station-modal').classList.add('open');
  updateSelectedDisplay(pendingName, pendingLat, pendingLon);

  // Init Leaflet on first open
  setTimeout(() => {
    if (!leafletMap) {
      leafletMap = L.map('leaflet-map').setView([pendingLat, pendingLon], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap', maxZoom: 18
      }).addTo(leafletMap);

      leafletMarker = L.marker([pendingLat, pendingLon], {draggable: true}).addTo(leafletMap);

      leafletMap.on('click', e => {
        leafletMarker.setLatLng(e.latlng);
        pendingLat = +e.latlng.lat.toFixed(4);
        pendingLon = +e.latlng.lng.toFixed(4);
        pendingName = `${pendingLat}°N, ${pendingLon}°E`;
        updateSelectedDisplay(pendingName, pendingLat, pendingLon);
      });

      leafletMarker.on('dragend', () => {
        const p = leafletMarker.getLatLng();
        pendingLat = +p.lat.toFixed(4); pendingLon = +p.lng.toFixed(4);
        pendingName = `${pendingLat}°N, ${pendingLon}°E`;
        updateSelectedDisplay(pendingName, pendingLat, pendingLon);
      });
    } else {
      leafletMap.setView([pendingLat, pendingLon], 7);
      leafletMarker.setLatLng([pendingLat, pendingLon]);
      leafletMap.invalidateSize();
    }
  }, 50);
}

function closeModal() {
  document.getElementById('station-modal').classList.remove('open');
  document.getElementById('search-results').innerHTML = '';
  document.getElementById('city-search').value = '';
}

function updateSelectedDisplay(name, lat, lon) {
  const el = document.getElementById('selected-location');
  el.style.display = 'flex';
  document.getElementById('selected-name').innerHTML = `<strong>${name}</strong>`;
  document.getElementById('selected-coords-text').textContent = `${lat}°N  ${lon}°E`;
}

function setStation(name, lat, lon) {
  pendingName = name; pendingLat = lat; pendingLon = lon;
  updateSelectedDisplay(name, lat, lon);
  if (leafletMap && leafletMarker) {
    leafletMap.setView([lat, lon], 9);
    leafletMarker.setLatLng([lat, lon]);
  }
  document.getElementById('search-results').innerHTML = '';
}

document.getElementById('btn-station').addEventListener('click', openModal);
document.getElementById('btn-modal-close').addEventListener('click', closeModal);
document.getElementById('btn-modal-cancel').addEventListener('click', closeModal);

document.getElementById('btn-modal-confirm').addEventListener('click', async () => {
  G.lat = pendingLat; G.lon = pendingLon; G.cityName = pendingName;
  document.getElementById('page-title').innerHTML = `📍 ${pendingName}`;
  document.title = `Погода — ${pendingName}`;
  closeModal();
  try { await loadData(); }
  catch(err) { alert('Ошибка загрузки данных: ' + err.message); }
});

// City search
async function searchCity(q) {
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=ru&format=json`;
  const data = await fetchJSON(url);
  return data.results || [];
}

document.getElementById('btn-search').addEventListener('click', async () => {
  const q = document.getElementById('city-search').value.trim();
  if (!q) return;
  const container = document.getElementById('search-results');
  container.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;padding:4px 0">Поиск…</div>';
  try {
    const results = await searchCity(q);
    if (!results.length) { container.innerHTML='<div style="color:var(--muted);font-size:0.85rem;padding:4px 0">Ничего не найдено</div>'; return; }
    container.innerHTML = results.map(r => `
      <div class="search-result-item" data-lat="${r.latitude}" data-lon="${r.longitude}" data-name="${r.name}${r.country?', '+r.country:''}">
        <span>${r.name}${r.admin1?', '+r.admin1:''}${r.country?', '+r.country:''}</span>
        <span class="coords">${r.latitude.toFixed(2)}°N ${r.longitude.toFixed(2)}°E</span>
      </div>`).join('');
    container.querySelectorAll('.search-result-item').forEach(el => {
      el.addEventListener('click', () => setStation(el.dataset.name, +el.dataset.lat, +el.dataset.lon));
    });
  } catch(e) { container.innerHTML='<div style="color:#f85149;font-size:0.85rem">Ошибка поиска</div>'; }
});

document.getElementById('city-search').addEventListener('keydown', e => {
  if (e.key==='Enter') document.getElementById('btn-search').click();
});

// Close on overlay click
document.getElementById('station-modal').addEventListener('click', e => {
  if (e.target===e.currentTarget) closeModal();
});

main();
</script>
